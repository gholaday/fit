<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Light Plan Schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Plan</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #FFFFFF; border-radius: 12px; padding: 4px">
      <a href="LA-Plan.dc.html" style="height: 34px; border-radius: 9px; color: #62636B; font: 500 13px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">This week</a>
      <button style="height: 34px; border: none; border-radius: 9px; background: #EBEBEE; color: #141518; font: 600 13px 'Inter', sans-serif">Schedule</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #E1ECF2; color: #4F8DB0; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path> <path d="M4 17l5 1l.75 -1.5"></path> <path d="M15 21v-4l-4 -3l1 -6"></path> <path d="M7 12v-3l5 -1l3 3l3 1"></path></svg>
        </div>
        <div style="flex: 1">
          <div style="font-size: 11px; color: #62636B">Running plan</div>
          <div style="font-size: 16px; font-weight: 600">Zone 2 Base</div>
        </div>
        <button style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid #DCDCE0; background: transparent; color: #141518; font: 500 12px 'Inter', sans-serif">Manage</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div><div style="font-size: 14px; font-weight: 600">Week 3 of 8</div><div style="font-size: 11px; color: #62636B">Progress</div></div>
        <div><div style="font-size: 14px; font-weight: 600">4 days</div><div style="font-size: 11px; color: #62636B">Tue, Thu, Fri, Sun</div></div>
        <div><div style="font-size: 14px; font-weight: 600">Sunday</div><div style="font-size: 11px; color: #62636B">Long run</div></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Every week</h2>
      <div style="font-size: 12px; color: #62636B">Tap a day to edit</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: #FFFFFF">
          <div style="width: 30px; font-size: 13px; font-weight: 600; padding-top: 5px">{{d.day}}</div>
          <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{d.chips}}" as="c" hint-placeholder-count="3">
              <div style="height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; font-size: 12px; font-weight: 500">{{c.t}}</div>
            </sc-for>
            <button aria-label="Add to {{d.day}}" style="width: 28px; height: 28px; border-radius: 14px; border: 1px dashed #C9C9CF; background: transparent; color: #62636B; display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"></path> <path d="M5 12l14 0"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 14px; font-size: 11px; color: #62636B">
      <div style="display: flex; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 4px; background: #4F8DB0"></div>Run, from plan</div>
      <div style="display: flex; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 4px; background: #8C83C0"></div>Workout</div>
      <div style="display: flex; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 4px; background: #5F9370"></div>Stretch</div>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px; border-top: 1px solid #E6E6EA; background: #F7F7F8">
    <a href="LA-Today.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path> <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path></svg>Today</a>
    <button style="background: none; border: none; color: #141518; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"></path> <path d="M16 3v4"></path> <path d="M8 3v4"></path> <path d="M4 11h16"></path> <path d="M11 15h1"></path> <path d="M12 15v3"></path></svg>Plan</button>
    <button style="background: none; border: none; color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path> <path d="M13 9h5"></path> <path d="M13 15h8"></path> <path d="M13 19h5"></path> <path d="M3 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path> <path d="M3 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path></svg>Library</button>
    <button style="background: none; border: none; color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6"></path> <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10"></path> <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14"></path> <path d="M4 20h14"></path></svg>Stats</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var R = { bg: '#E1ECF2', fg: '#2F6A8C' }, W = { bg: '#ECEAF5', fg: '#5E5596' }, S = { bg: '#E3EEE5', fg: '#3F6E4C' };
    function chip(k, t) { return { t: t, bg: k.bg, fg: k.fg }; }
    var days = [
      { day: 'Mon', chips: [chip(W, 'Pull'), chip(S, 'Morning, 7:00 AM'), chip(S, 'Evening, 9:30 PM')] },
      { day: 'Tue', chips: [chip(R, 'Run'), chip(W, 'Push'), chip(S, 'Morning'), chip(S, 'Evening')] },
      { day: 'Wed', chips: [chip(S, 'Morning'), chip(S, 'Evening')] },
      { day: 'Thu', chips: [chip(R, 'Run'), chip(W, 'Legs'), chip(S, 'Morning'), chip(S, 'Evening')] },
      { day: 'Fri', chips: [chip(R, 'Run'), chip(S, 'Morning'), chip(S, 'Evening')] },
      { day: 'Sat', chips: [chip(S, 'Morning')] },
      { day: 'Sun', chips: [chip(R, 'Long run'), chip(S, 'Morning')] }
    ];
    return { days: days };
  }
}
</script>
</body>
</html>
