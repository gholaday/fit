<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Stats</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #EBEBEE; border-radius: 12px; padding: 4px">
      <button style="height: 32px; border: none; border-radius: 9px; background: #FFFFFF; color: #141518; font: 600 13px 'Inter', sans-serif">Week</button>
      <button style="height: 32px; border: none; border-radius: 9px; background: transparent; color: #62636B; font: 500 13px 'Inter', sans-serif">Month</button>
      <button style="height: 32px; border: none; border-radius: 9px; background: transparent; color: #62636B; font: 500 13px 'Inter', sans-serif">3 months</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; color: #62636B">Oct 26 to Nov 1</div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 32px; height: 32px; border-radius: 9px; background: {{r.tile}}; color: {{r.c}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path> <path d="M4 17l5 1l.75 -1.5"></path> <path d="M15 21v-4l-4 -3l1 -6"></path> <path d="M7 12v-3l5 -1l3 3l3 1"></path></svg></sc-if>
            <sc-if value="{{r.isLift}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h1"></path> <path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2"></path> <path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M9 12h6"></path> <path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2"></path> <path d="M22 12h-1"></path></svg></sc-if>
            <sc-if value="{{r.isStretch}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M5 20l5 -.5l1 -2"></path> <path d="M18 20v-5h-5.5l2.5 -6.5l-5.5 1l1.5 2"></path></svg></sc-if>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
            <div style="display: flex; justify-content: space-between; font-size: 14px">
              <div style="font-weight: 500">{{r.name}}</div>
              <div style="font-weight: 600; font-variant-numeric: tabular-nums">{{r.val}}</div>
            </div>
            <div style="height: 5px; border-radius: 3px; background: #EDEDF0; overflow: hidden"><div style="width: {{r.pct}}%; height: 100%; background: {{r.c}}"></div></div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 15px; font-weight: 600">Pace at Zone 2</div>
        <div style="font-size: 12px; color: #62636B">Since week 1</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <div style="font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">11:56 /mi</div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #3F6E4C">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6 -6l4 4l8 -8"></path> <path d="M14 7l7 0l0 7"></path></svg>
          10 s faster
        </div>
      </div>
      <svg width="318" height="86" viewBox="0 0 318 86" role="img" aria-label="Pace at Zone 2 getting faster over three weeks">
        <line x1="0" y1="80" x2="318" y2="80" stroke="#EDEDF0" stroke-width="1"></line>
        <polyline points="10,66 60,58 110,61 160,46 210,40 260,34 308,26" fill="none" stroke="#4F8DB0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <circle cx="308" cy="26" r="4.5" fill="#4F8DB0"></circle>
      </svg>
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #6B6C74">
        <div>Week 1</div><div>Week 2</div><div>Week 3</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 15px; font-weight: 600">Steps</div>
        <div style="font-size: 12px; color: #62636B">8,450 a day on average</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 70px" role="img" aria-label="Steps per day this week">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="width: 100%; height: {{s.h}}px; border-radius: 5px; background: {{s.c}}"></div>
            <div style="font-size: 10px; color: #6B6C74">{{s.d}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px; border-top: 1px solid #E6E6EA; background: #F7F7F8">
    <a href="LA-Today.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path> <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path></svg>Today</a>
    <a href="LA-Plan.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"></path> <path d="M16 3v4"></path> <path d="M8 3v4"></path> <path d="M4 11h16"></path> <path d="M11 15h1"></path> <path d="M12 15v3"></path></svg>Plan</a>
    <button style="background: none; border: none; color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path> <path d="M13 9h5"></path> <path d="M13 15h8"></path> <path d="M13 19h5"></path> <path d="M3 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path> <path d="M3 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path></svg>Library</button>
    <button style="background: none; border: none; color: #141518; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6"></path> <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10"></path> <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14"></path> <path d="M4 20h14"></path></svg>Stats</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      { name: 'Zone 2', val: '120 of 120 min', pct: 100, c: '#4F8DB0', tile: '#E1ECF2', isRun: true, isLift: false, isStretch: false },
      { name: 'Workouts', val: '3 of 3', pct: 100, c: '#8C83C0', tile: '#ECEAF5', isRun: false, isLift: true, isStretch: false },
      { name: 'Morning stretch', val: '7 of 7', pct: 100, c: '#5F9370', tile: '#E3EEE5', isRun: false, isLift: false, isStretch: true },
      { name: 'Evening stretch', val: '2 of 5', pct: 40, c: '#5F9370', tile: '#E3EEE5', isRun: false, isLift: false, isStretch: true }
    ];
    var vals = [7800, 9100, 6400, 8800, 9600, 11200, 6250];
    var steps = vals.map(function (v, i) {
      return { h: Math.round(v / 11200 * 54), d: ['M', 'T', 'W', 'T', 'F', 'S', 'S'][i], c: v >= 8000 ? '#141518' : '#C9CACF' };
    });
    return { rows: rows, steps: steps };
  }
}
</script>
</body>
</html>
