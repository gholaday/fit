<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Light Run Summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="LA-Today.dc.html" aria-label="Back to Today" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg>
      </a>
      <div style="text-align: center">
        <div style="font-size: 16px; font-weight: 600">Zone 2 Run</div>
        <div style="font-size: 12px; color: #62636B">Tue, Oct 27, 6:12 PM</div>
      </div>
      <button aria-label="More options" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg>
      </button>
    </div>

    <div style="position: relative; height: 168px; border-radius: 18px; background: #EFEFF1; overflow: hidden">
      <svg width="350" height="168" viewBox="0 0 350 168" role="img" aria-label="Route map, loop of 2.94 miles">
        <path d="M0 40 H350 M0 100 H350 M90 0 V168 M230 0 V168" stroke="#E9E9EC" stroke-width="10"></path>
        <polyline points="70,128 64,96 82,70 120,52 168,46 214,38 262,48 290,76 284,108 250,124 206,118 170,128 128,138 92,140 70,128" fill="none" stroke="#4F8DB0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <circle cx="70" cy="128" r="6" fill="#141518"></circle>
      </svg>
      <div style="position: absolute; left: 12px; top: 10px; font-size: 11px; color: #6B6C74">[Map tiles]</div>
      <button style="position: absolute; right: 10px; bottom: 10px; height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #141518; color: #F7F7F8; font: 600 13px 'Inter', sans-serif; display: flex; align-items: center; gap: 6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z"></path></svg>
        Replay
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px 2px">
      <div><div style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">35:04</div><div style="font-size: 11px; color: #62636B">Time</div></div>
      <div><div style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">2.94</div><div style="font-size: 11px; color: #62636B">Miles</div></div>
      <div><div style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">11:56</div><div style="font-size: 11px; color: #62636B">Pace /mi</div></div>
      <div><div style="font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums">137</div><div style="font-size: 11px; color: #62636B">Avg bpm</div></div>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 15px; font-weight: 600">Heart rate</div>
        <div style="font-size: 13px; color: #62636B"><span style="color: #141518; font-weight: 600">91%</span> in Zone 2</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 3px; height: 8px">
          <div style="flex: 4 1 0; border-radius: 4px; background: #C9CACF"></div>
          <div style="flex: 91 1 0; border-radius: 4px; background: #4F8DB0"></div>
          <div style="flex: 5 1 0; border-radius: 4px; background: #B8894F"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #62636B">
          <div>Zone 1, 4%</div><div>Zone 2, 91%</div><div>Zone 3, 5%</div>
        </div>
      </div>
      <svg width="322" height="132" viewBox="0 0 322 132" role="img" aria-label="Heart rate over the run, mostly inside zone 2 with a short rise above it near minute 27">
        <rect x="0" y="{{band.y}}" width="322" height="{{band.h}}" fill="#E1ECF2"></rect>
        <line x1="0" y1="{{band.y}}" x2="322" y2="{{band.y}}" stroke="#4F8DB0" stroke-width="1" stroke-dasharray="3 4"></line>
        <line x1="0" y1="{{band.y2}}" x2="322" y2="{{band.y2}}" stroke="#B9CCD8" stroke-width="1" stroke-dasharray="3 4"></line>
        <polyline points="{{pts}}" fill="none" stroke="#141518" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
        <text x="320" y="{{band.ty}}" fill="#62636B" font-size="10" text-anchor="end" font-family="Inter, sans-serif">145</text>
        <text x="320" y="{{band.ty2}}" fill="#62636B" font-size="10" text-anchor="end" font-family="Inter, sans-serif">128</text>
      </svg>
      <div style="display: flex; justify-content: space-between; font-size: 10px; color: #6B6C74; margin-top: -6px">
        <div>0</div><div>10 min</div><div>20 min</div><div>30 min</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid #E3E3E7">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #E3EEE5; color: #5F9370; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M5 20l5 -.5l1 -2"></path> <path d="M18 20v-5h-5.5l2.5 -6.5l-5.5 1l1.5 2"></path></svg>
      </div>
      <div style="flex: 1">
        <div style="font-size: 15px; font-weight: 500">Post-run stretch</div>
        <div style="font-size: 12px; color: #62636B">4 moves, 5 min</div>
      </div>
      <a href="LA-Stretch.dc.html" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #DCDCE0; color: #141518; font: 500 13px 'Inter', sans-serif; display: flex; align-items: center; text-decoration: none">Start</a>
    </div>
  </div>

  <div style="padding: 12px 20px 30px">
    <button style="width: 100%; height: 50px; border-radius: 14px; border: none; background: #141518; color: #F7F7F8; font: 600 15px 'Inter', sans-serif">Save</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var hr = [98,104,108,110,112,120,128,132,134,135,136,136,137,137,138,138,138,139,139,139,140,140,141,141,141,142,143,147,144,142,123,116,112,110,108,107];
    var H = 120, top = 170, span = 75;
    function y(v) { return ((top - v) / span * H + 6); }
    var pts = hr.map(function (v, i) { return (i * 322 / 35).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ');
    var band = { y: y(145).toFixed(1), y2: y(128).toFixed(1), h: (y(128) - y(145)).toFixed(1), ty: (y(145) - 4).toFixed(1), ty2: (y(128) + 12).toFixed(1) };
    return { pts: pts, band: band };
  }
}
</script>
</body>
</html>
