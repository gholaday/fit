<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Library</h1>
      <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #141518; color: #F7F7F8; font: 600 13px 'Inter', sans-serif; display: flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l0 14"></path> <path d="M5 12l14 0"></path></svg>
        New
      </button>
    </div>

    <label style="height: 42px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6B6C74">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path> <path d="M21 21l-6 -6"></path></svg>
      <input aria-label="Search the library" placeholder="Search workouts, routines, exercises" style="flex: 1; border: none; background: transparent; font: 400 14px 'Inter', sans-serif; color: #141518; outline: none">
    </label>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Workouts</h2>
        <div style="font-size: 12px; color: #62636B">3</div>
      </div>
      <sc-for list="{{workouts}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF">
          <div style="width: 34px; height: 34px; border-radius: 10px; background: #ECEAF5; color: #8C83C0; display: flex; align-items: center; justify-content: center">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h1"></path> <path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2"></path> <path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M9 12h6"></path> <path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2"></path> <path d="M22 12h-1"></path></svg>
          </div>
          <div style="flex: 1">
            <div style="font-size: 15px; font-weight: 600">{{w.name}}</div>
            <div style="font-size: 12px; color: #62636B">{{w.sub}}</div>
          </div>
          <div style="font-size: 12px; color: #62636B">{{w.day}}</div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Stretch routines</h2>
        <div style="font-size: 12px; color: #62636B">2 yours, 6 starters</div>
      </div>
      <sc-for list="{{stretches}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF">
          <div style="width: 34px; height: 34px; border-radius: 10px; background: #E3EEE5; color: #5F9370; display: flex; align-items: center; justify-content: center">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M5 20l5 -.5l1 -2"></path> <path d="M18 20v-5h-5.5l2.5 -6.5l-5.5 1l1.5 2"></path></svg>
          </div>
          <div style="flex: 1">
            <div style="font-size: 15px; font-weight: 600">{{s.name}}</div>
            <div style="font-size: 12px; color: #62636B">{{s.sub}}</div>
          </div>
          <div style="font-size: 12px; color: #62636B">{{s.day}}</div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Run workouts</h2>
        <div style="font-size: 12px; color: #62636B">Use any day, outside the plan</div>
      </div>
      <sc-for list="{{runs}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF">
          <div style="width: 34px; height: 34px; border-radius: 10px; background: #E1ECF2; color: #4F8DB0; display: flex; align-items: center; justify-content: center">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path> <path d="M4 17l5 1l.75 -1.5"></path> <path d="M15 21v-4l-4 -3l1 -6"></path> <path d="M7 12v-3l5 -1l3 3l3 1"></path></svg>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <div style="font-size: 15px; font-weight: 600">{{r.name}}</div>
              <div style="font-size: 12px; color: #62636B">{{r.sub}}</div>
            </div>
            <div style="display: flex; gap: 2px; height: 5px">
              <sc-for list="{{r.bar}}" as="b" hint-placeholder-count="5">
                <div style="flex: {{b.f}} 1 0; border-radius: 3px; background: {{b.c}}"></div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; box-shadow: inset 0 0 0 1px #E3E3E7">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: #EBEBEE; color: #3A3B42; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"></path> <path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"></path> <path d="M3 6l0 13"></path> <path d="M12 6l0 13"></path> <path d="M21 6l0 13"></path></svg>
      </div>
      <div style="flex: 1">
        <div style="font-size: 15px; font-weight: 600">Exercises</div>
        <div style="font-size: 12px; color: #62636B">870 in the catalog, 4 custom</div>
      </div>
      <span style="display: flex; color: #6B6C74"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"></path></svg></span>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px; border-top: 1px solid #E6E6EA; background: #F7F7F8">
    <a href="LA-Today.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path> <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path></svg>Today</a>
    <a href="LA-Plan.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"></path> <path d="M16 3v4"></path> <path d="M8 3v4"></path> <path d="M4 11h16"></path> <path d="M11 15h1"></path> <path d="M12 15v3"></path></svg>Plan</a>
    <button style="background: none; border: none; color: #141518; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path> <path d="M13 9h5"></path> <path d="M13 15h8"></path> <path d="M13 19h5"></path> <path d="M3 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path> <path d="M3 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path></svg>Library</button>
    <a href="L-Stats.dc.html" style="color: #6B6C74; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6"></path> <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10"></path> <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14"></path> <path d="M4 20h14"></path></svg>Stats</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var workouts = [
      { name: 'Pull', sub: '6 exercises, about 55 min', day: 'Mon' },
      { name: 'Push', sub: '6 exercises, about 50 min', day: 'Tue' },
      { name: 'Legs', sub: '5 exercises, about 50 min', day: 'Thu' }
    ];
    var stretches = [
      { name: 'Morning', sub: '6 moves, 8 min', day: 'Daily' },
      { name: 'Evening', sub: '7 moves, 9 min', day: 'Mon to Fri' }
    ];
    var E = '#9EC3D8', W = '#D0D0D5', H = '#C9A273';
    function bar(parts) { return parts.map(function (p) { return { f: p[0], c: p[1] }; }); }
    var rep = [[10, E]]; for (var i = 0; i < 6; i++) { rep.push([2.5, H]); rep.push([1.5, W]); } rep.push([8, E]);
    var hill = [[10, E]]; for (var j = 0; j < 8; j++) { hill.push([0.8, H]); hill.push([1.5, W]); } hill.push([8, E]);
    var runs = [
      { name: '800 m repeats', sub: '6 x 800 m, 50 min', bar: bar(rep) },
      { name: 'Hill sprints', sub: '8 x 30 s, 35 min', bar: bar(hill) }
    ];
    return { workouts: workouts, stretches: stretches, runs: runs };
  }
}
</script>
</body>
</html>
