<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Light Strength</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

  <div style="padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E6E6EA">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="LA-Today.dc.html" aria-label="Back to Today" style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg>
      </a>
      <div style="text-align: center">
        <div style="font-size: 16px; font-weight: 600">Push</div>
        <div style="font-size: 12px; color: #62636B; font-variant-numeric: tabular-nums">18:42</div>
      </div>
      <button style="height: 36px; padding: 0 16px; border-radius: 18px; border: none; background: #141518; color: #F7F7F8; font: 600 14px 'Inter', sans-serif">Finish</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF">
      <div style="font-size: 13px; color: #62636B">Rest</div>
      <div style="flex: 1; height: 6px; border-radius: 3px; background: #E6E6EA; overflow: hidden"><div style="width: 60%; height: 100%; background: #8C83C0"></div></div>
      <div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">1:12</div>
      <button style="height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid #DCDCE0; background: transparent; color: #141518; font: 500 12px 'Inter', sans-serif">+30 s</button>
    </div>
  </div>

  <div style="flex: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
    <sc-for list="{{exercises}}" as="ex" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #ECEAF5; color: #8C83C0; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h1"></path> <path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2"></path> <path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M9 12h6"></path> <path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2"></path> <path d="M22 12h-1"></path></svg>
          </div>
          <div style="flex: 1">
            <div style="font-size: 16px; font-weight: 600">{{ex.name}}</div>
            <div style="font-size: 12px; color: #62636B">{{ex.sub}}</div>
          </div>
          <button aria-label="Exercise options" style="width: 32px; height: 32px; border: none; border-radius: 16px; background: transparent; color: #62636B; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M18 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: 34px 1fr 64px 56px 40px; gap: 6px; font-size: 11px; color: #6B6C74; padding: 0 4px">
          <div>Set</div><div>Previous</div><div style="text-align: center">lb</div><div style="text-align: center">Reps</div><div></div>
        </div>
        <sc-for list="{{ex.sets}}" as="s" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 34px 1fr 64px 56px 40px; gap: 6px; align-items: center; padding: 6px 4px; border-radius: 10px; background: {{s.rowBg}}">
            <div style="font-size: 14px; font-weight: 600; color: {{s.numColor}}">{{s.n}}</div>
            <div style="font-size: 13px; color: #6B6C74; font-variant-numeric: tabular-nums">{{s.prev}}</div>
            <div style="height: 34px; border-radius: 8px; background: {{s.cellBg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{s.valColor}}">{{s.w}}</div>
            <div style="height: 34px; border-radius: 8px; background: {{s.cellBg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{s.valColor}}">{{s.r}}</div>
            <button aria-label="Complete set" style="width: 34px; height: 34px; border-radius: 8px; border: none; background: {{s.checkBg}}; color: {{s.checkFg}}; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10 -10"></path></svg>
            </button>
          </div>
        </sc-for>
        <button style="height: 36px; border-radius: 10px; border: 1px dashed #DCDCE0; background: transparent; color: #62636B; font: 500 13px 'Inter', sans-serif">Add set</button>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 30px; border-top: 1px solid #E6E6EA; display: flex; gap: 8px">
    <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #DCDCE0; background: transparent; color: #141518; font: 500 15px 'Inter', sans-serif">Add exercise</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function set(n, prev, w, r, state) {
      var done = state === 'done', cur = state === 'current';
      return {
        n: n, prev: prev, w: w, r: r,
        rowBg: done ? '#EEF5EF' : 'transparent',
        numColor: done ? '#5F9370' : '#141518',
        cellBg: done ? 'transparent' : '#FFFFFF',
        valColor: done ? '#3A3B42' : (cur ? '#141518' : '#62636B'),
        checkBg: done ? '#5F9370' : '#FFFFFF',
        checkFg: done ? '#F7F7F8' : '#8C8D95'
      };
    }
    var exercises = [
      { name: 'Bench Press', sub: 'Barbell, 3 sets', sets: [
        set('1', '135 x 10', '135', '10', 'done'),
        set('2', '155 x 8', '155', '8', 'done'),
        set('3', '155 x 8', '155', '8', 'current')
      ] },
      { name: 'Overhead Press', sub: 'Dumbbell, 3 sets', sets: [
        set('1', '40 x 10', '40', '10', ''),
        set('2', '40 x 10', '40', '10', ''),
        set('3', '40 x 9', '40', '9', '')
      ] }
    ];
    return { exercises: exercises };
  }
}
</script>
</body>
</html>
