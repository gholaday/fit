<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-run pace step</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 20px 36px; gap: 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Lock screen" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"></path> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"></path> <path d="M8 11v-4a4 4 0 1 1 8 0v4"></path></svg>
    </button>
    <div style="text-align: center">
      <div style="font-size: 14px; font-weight: 600">Speed mix</div>
      <div style="font-size: 11px; color: #62636B">Interval 2 of 4</div>
    </div>
    <button aria-label="Show map" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13"></path> <path d="M9 4v13"></path> <path d="M15 7v13"></path></svg>
    </button>
  </div>

  <div style="display: flex; gap: 2px; height: 6px">
    <sc-for list="{{bar}}" as="b" hint-placeholder-count="12">
      <div style="flex: {{b.f}} 1 0; border-radius: 3px; background: {{b.c}}; opacity: {{b.o}}"></div>
    </sc-for>
  </div>

  <div style="position: relative; width: 300px; height: 280px; align-self: center; margin-top: 6px">
    <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Pace 8:02 per mile, inside the 7:55 to 8:15 target">
      <circle cx="150" cy="150" r="120" fill="none" stroke="#E6E6EA" stroke-width="10" stroke-dasharray="565.5 188.5" transform="rotate(135 150 150)"></circle>
      <circle cx="150" cy="150" r="120" fill="none" stroke="#C9A273" stroke-width="14" stroke-dasharray="100 653.98" stroke-dashoffset="-232" transform="rotate(135 150 150)"></circle>
      <circle cx="160.5" cy="30.5" r="11" fill="#F7F7F8"></circle>
      <circle cx="160.5" cy="30.5" r="7" fill="#141518"></circle>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 74px; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 13px; color: #7A5530; font-weight: 600">On pace</div>
      <div style="font-size: 84px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">8:02</div>
      <div style="font-size: 14px; color: #62636B">/mi, target 7:55-8:15</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 246px; display: flex; justify-content: space-between; padding: 0 40px; font-size: 11px; color: #6B6C74">
      <div>Slower</div><div>Faster</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px">
      <div style="font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums">220 m</div>
      <div style="font-size: 12px; color: #62636B">Left in interval</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px">
      <div style="font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums">161</div>
      <div style="font-size: 12px; color: #62636B">Heart rate</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; box-shadow: inset 0 0 0 1px #E3E3E7">
    <div style="font-size: 12px; color: #62636B">Next</div>
    <div style="flex: 1; font-size: 15px; font-weight: 500">Recover, walk</div>
    <div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">1:30</div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 16px">
    <button aria-label="End workout" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 4h-10a3 3 0 0 0 -3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3 -3v-10a3 3 0 0 0 -3 -3z"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 80px; height: 80px; border-radius: 40px; border: none; background: #141518; color: #F7F7F8; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path> <path d="M17 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path></svg>
    </button>
    <button aria-label="Skip step" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #FFFFFF; color: #141518; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5v14a1 1 0 0 0 1.504 .864l12 -7a1 1 0 0 0 0 -1.728l-12 -7a1 1 0 0 0 -1.504 .864z"></path> <path d="M20 4a1 1 0 0 1 .993 .883l.007 .117v14a1 1 0 0 1 -1.993 .117l-.007 -.117v-14a1 1 0 0 1 1 -1z"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var E = '#9EC3D8', W = '#D0D0D5', H = '#C9A273', S = '#B97A5B';
    var segs = [[10, E]];
    for (var i = 0; i < 4; i++) { segs.push([2, H]); segs.push([1.5, W]); }
    for (var j = 0; j < 6; j++) { segs.push([0.4, S]); segs.push([1, W]); }
    segs.push([8, E]);
    var bar = segs.map(function (s, idx) { return { f: s[0], c: s[1], o: idx <= 3 ? 1 : 0.35 }; });
    return { bar: bar };
  }
}
</script>
</body>
</html>
