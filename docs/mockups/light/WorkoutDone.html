<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout finished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#141518}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F7F8; color: #141518; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 13px; background: #ECEAF5; color: #8C83C0; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h1"></path> <path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2"></path> <path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M9 12h6"></path> <path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2"></path> <path d="M22 12h-1"></path></svg>
      </div>
      <div>
        <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Push</div>
        <div style="font-size: 13px; color: #62636B">Tue, Oct 27, finished 1:12 PM</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #FFFFFF; border-radius: 16px; padding: 14px 16px">
      <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">48 min</div><div style="font-size: 12px; color: #62636B">Duration</div></div>
      <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">17</div><div style="font-size: 12px; color: #62636B">Sets</div></div>
      <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">9,840 lb</div><div style="font-size: 12px; color: #62636B">Volume</div></div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{ex}}" as="e" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: {{e.border}}">
          <div style="flex: 1">
            <div style="font-size: 15px; font-weight: 500">{{e.name}}</div>
            <div style="font-size: 12px; color: #62636B">{{e.sets}}</div>
          </div>
          <div style="font-size: 12px; font-weight: 500; color: {{e.changeColor}}">{{e.change}}</div>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 0 0 1.5px #8C83C0">
      <div>
        <div style="font-size: 15px; font-weight: 600">Update Push with these weights?</div>
        <div style="font-size: 13px; color: #62636B; margin-top: 4px; line-height: 1.4">Bench Press and Incline Dumbbell Press went up 5 lb. Next time starts from the new numbers.</div>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #DCDCE0; background: #FFFFFF; color: #141518; font: 500 14px 'Inter', sans-serif">Keep as is</button>
        <button style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #8C83C0; color: #FFFFFF; font: 600 14px 'Inter', sans-serif">Update workout</button>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 30px">
    <a href="LA-Today.dc.html" style="width: 100%; height: 52px; border-radius: 14px; background: #141518; color: #F7F7F8; font: 600 15px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      ['Bench Press', '135 x 10, 155 x 8, 160 x 8', 'Up 5 lb'],
      ['Overhead Press', '40 x 10, 40 x 10, 40 x 9', ''],
      ['Incline Dumbbell Press', '45 x 10, 50 x 10, 50 x 9', 'Up 5 lb'],
      ['Cable Fly', '30 x 12, 30 x 12, 30 x 12', ''],
      ['Triceps Pushdown', '50 x 12, 50 x 12, 50 x 11', '']
    ];
    var ex = raw.map(function (r, i) {
      return { name: r[0], sets: r[1], change: r[2], changeColor: '#5E5596', border: i ? '1px solid #EDEDF0' : '1px solid transparent' };
    });
    return { ex: ex };
  }
}
</script>
</body>
</html>
