<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Plan This week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #111214; color: #ECECEE; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <div style="flex: 1; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Plan</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #1A1B1F; border-radius: 12px; padding: 4px">
      <button style="height: 34px; border: none; border-radius: 9px; background: #2C2D33; color: #ECECEE; font: 600 13px 'Inter', sans-serif">This week</button>
      <a href="M-Schedule.dc.html" style="height: 34px; border-radius: 9px; color: #9C9DA5; font: 500 13px 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Schedule</a>
    </div>

    <div style="background: #1A1B1F; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #1C2730; color: #6FA8C7; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path> <path d="M4 17l5 1l.75 -1.5"></path> <path d="M15 21v-4l-4 -3l1 -6"></path> <path d="M7 12v-3l5 -1l3 3l3 1"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 15px; font-weight: 600">Zone 2 Base</div>
          <div style="font-size: 12px; color: #9C9DA5">Week 3 of 8</div>
        </div>
        <div style="height: 4px; border-radius: 2px; background: #26272D; overflow: hidden"><div style="width: 29%; height: 100%; background: #6FA8C7"></div></div>
        <div style="font-size: 11px; color: #9C9DA5">35 of 120 min in Zone 2 this week</div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <button aria-label="Previous week" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg>
      </button>
      <div style="text-align: center">
        <div style="font-size: 15px; font-weight: 600">Oct 26 to Nov 1</div>
        <div style="font-size: 11px; color: #9C9DA5">Hold and drag to move a day</div>
      </div>
      <button aria-label="Next week" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: grid; grid-template-columns: 38px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 0 2px; color: #7C7D85; font-size: 11px">
        <div></div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.007 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path> <path d="M4 17l5 1l.75 -1.5"></path> <path d="M15 21v-4l-4 -3l1 -6"></path> <path d="M7 12v-3l5 -1l3 3l3 1"></path></svg>Run</div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h1"></path> <path d="M6 8h-2a1 1 0 0 0 -1 1v6a1 1 0 0 0 1 1h2"></path> <path d="M6 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M9 12h6"></path> <path d="M15 7v10a1 1 0 0 0 1 1h1a1 1 0 0 0 1 -1v-10a1 1 0 0 0 -1 -1h-1a1 1 0 0 0 -1 1"></path> <path d="M18 8h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2"></path> <path d="M22 12h-1"></path></svg>Workout</div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M5 20l5 -.5l1 -2"></path> <path d="M18 20v-5h-5.5l2.5 -6.5l-5.5 1l1.5 2"></path></svg>Stretch</div>
      </div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 38px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; padding: 4px 0; border-radius: 12px; box-shadow: {{d.ring}}">
          <div style="padding: 4px 0 0 6px">
            <div style="font-size: 10px; font-weight: 500; color: #9C9DA5">{{d.dow}}</div>
            <div style="font-size: 15px; font-weight: 600">{{d.date}}</div>
          </div>
          <sc-for list="{{d.cells}}" as="c" hint-placeholder-count="3">
            <div style="min-height: 44px; border-radius: 10px; background: {{c.bg}}; padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; opacity: {{c.op}}">
              <div style="font-size: 12px; font-weight: 600; line-height: 1.2">{{c.name}}</div>
              <div style="font-size: 10px; color: #9C9DA5; line-height: 1.3">{{c.meta}}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 22px; border-top: 1px solid #1D1E22; background: #111214">
    <a href="Main.dc.html" style="color: #7C7D85; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path> <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path></svg>Today</a>
    <button style="background: none; border: none; color: #ECECEE; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12"></path> <path d="M16 3v4"></path> <path d="M8 3v4"></path> <path d="M4 11h16"></path> <path d="M11 15h1"></path> <path d="M12 15v3"></path></svg>Plan</button>
    <button style="background: none; border: none; color: #7C7D85; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path> <path d="M13 9h5"></path> <path d="M13 15h8"></path> <path d="M13 19h5"></path> <path d="M3 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path> <path d="M3 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4"></path></svg>Library</button>
    <button style="background: none; border: none; color: #7C7D85; font: 500 11px 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6"></path> <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10"></path> <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14"></path> <path d="M4 20h14"></path></svg>Stats</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function cell(type, name, meta, state) {
      if (!name) return { name: '', meta: '', bg: 'transparent', op: 1 };
      var bg = { c: '#1C2730', s: '#24222F', r: '#1F2A22' }[type];
      return { name: name, meta: meta, bg: bg, op: state === 'done' ? 0.5 : 1 };
    }
    var raw = [
      ['Mon', '26', ['', '', ''], ['Pull', 'Done', 'done'], ['Morning', 'Evening, done', 'done'], ''],
      ['Tue', '27', ['Zone 2', '35 min', ''], ['Push', '6 exercises', ''], ['Morning', 'Evening', ''], 'today'],
      ['Wed', '28', ['', '', ''], ['', '', ''], ['Morning', 'Evening', ''], ''],
      ['Thu', '29', ['Zone 2', '35 min', ''], ['Legs', '5 exercises', ''], ['Morning', 'Evening', ''], ''],
      ['Fri', '30', ['Zone 2', '35 min', ''], ['', '', ''], ['Morning', 'Evening', ''], ''],
      ['Sat', '31', ['', '', ''], ['', '', ''], ['Morning', '', ''], ''],
      ['Sun', '1', ['Zone 2 Long', '50 min', ''], ['', '', ''], ['Morning', '', ''], '']
    ];
    var days = raw.map(function (r) {
      return {
        dow: r[0], date: r[1],
        ring: r[5] === 'today' ? 'inset 0 0 0 1.5px #ECECEE' : 'none',
        cells: [cell('c', r[2][0], r[2][1], r[2][2]), cell('s', r[3][0], r[3][1], r[3][2]), cell('r', r[4][0], r[4][1], r[4][2])]
      };
    });
    return { days: days };
  }
}
</script>
</body>
</html>
