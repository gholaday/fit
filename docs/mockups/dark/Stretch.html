<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Stretch Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #111214; color: #ECECEE; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 20px 34px; gap: 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"></path> <path d="M6 6l12 12"></path></svg>
    </a>
    <div style="text-align: center">
      <div style="font-size: 14px; font-weight: 600">Evening stretch</div>
      <div style="font-size: 12px; color: #9C9DA5">3 of 7</div>
    </div>
    <button aria-label="All moves" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l11 0"></path> <path d="M9 12l11 0"></path> <path d="M9 18l11 0"></path> <path d="M5 6l0 .01"></path> <path d="M5 12l0 .01"></path> <path d="M5 18l0 .01"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{segs}}" as="s" hint-placeholder-count="7">
      <div style="height: 4px; border-radius: 2px; background: {{s.c}}"></div>
    </sc-for>
  </div>

  <div style="height: 250px; border-radius: 20px; background: #1A1B1F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #8DB596">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path> <path d="M5 20l5 -.5l1 -2"></path> <path d="M18 20v-5h-5.5l2.5 -6.5l-5.5 1l1.5 2"></path></svg>
    <div style="font-size: 12px; color: #7C7D85">[Exercise image from catalog]</div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Pigeon</div>
      <div style="font-size: 14px; color: #9C9DA5; margin-top: 4px; line-height: 1.4">Front shin across the mat, back leg long. Sink the hips and keep the chest tall.</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 18px">
    <div style="position: relative; width: 120px; height: 120px; flex-shrink: 0">
      <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#26272D" stroke-width="8"></circle>
        <circle cx="60" cy="60" r="52" fill="none" stroke="#8DB596" stroke-width="8" stroke-linecap="round" stroke-dasharray="196 327" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums">0:24</div>
        <div style="font-size: 11px; color: #9C9DA5">of 0:40</div>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <div style="height: 36px; border-radius: 10px; background: #ECECEE; color: #111214; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">Left</div>
        <div style="height: 36px; border-radius: 10px; border: 1px solid #2E2F35; color: #9C9DA5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">Right</div>
      </div>
      <button style="height: 36px; border-radius: 10px; border: 1px solid #2E2F35; background: transparent; color: #ECECEE; font: 500 13px 'Inter', sans-serif">+15 s</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1px solid #222328">
    <div style="font-size: 12px; color: #9C9DA5">Next</div>
    <div style="flex: 1; font-size: 15px; font-weight: 500">Figure-4</div>
    <div style="font-size: 13px; color: #9C9DA5">30 s each side</div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 16px">
    <button aria-label="Previous move" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.496 4.136l-12 7a1 1 0 0 0 0 1.728l12 7a1 1 0 0 0 1.504 -.864v-14a1 1 0 0 0 -1.504 -.864z"></path> <path d="M4 4a1 1 0 0 1 .993 .883l.007 .117v14a1 1 0 0 1 -1.993 .117l-.007 -.117v-14a1 1 0 0 1 1 -1z"></path></svg>
    </button>
    <button aria-label="Pause" style="width: 80px; height: 80px; border-radius: 40px; border: none; background: #ECECEE; color: #111214; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path> <path d="M17 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path></svg>
    </button>
    <button aria-label="Next move" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5v14a1 1 0 0 0 1.504 .864l12 -7a1 1 0 0 0 0 -1.728l-12 -7a1 1 0 0 0 -1.504 .864z"></path> <path d="M20 4a1 1 0 0 1 .993 .883l.007 .117v14a1 1 0 0 1 -1.993 .117l-.007 -.117v-14a1 1 0 0 1 1 -1z"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var segs = [];
    for (var i = 0; i < 7; i++) segs.push({ c: i < 2 ? '#8DB596' : (i === 2 ? '#5E7D66' : '#26272D') });
    return { segs: segs };
  }
}
</script>
</body>
</html>
