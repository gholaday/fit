<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight In-run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#ECECEE}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #111214; color: #ECECEE; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 20px 36px; gap: 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Lock screen" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6"></path> <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"></path> <path d="M8 11v-4a4 4 0 1 1 8 0v4"></path></svg>
    </button>
    <div style="text-align: center">
      <div style="font-size: 14px; font-weight: 600">Zone 2 Run</div>
      <div style="font-size: 11px; color: #9C9DA5">Step 2 of 3</div>
    </div>
    <button aria-label="Show map" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6 -3l6 3l6 -3v13l-6 3l-6 -3l-6 3v-13"></path> <path d="M9 4v13"></path> <path d="M15 7v13"></path></svg>
    </button>
  </div>

  <div style="position: relative; width: 300px; height: 280px; align-self: center; margin-top: 10px">
    <svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Heart rate 138 bpm, inside zone 2, 128 to 145">
      <sc-for list="{{arcs}}" as="a" hint-placeholder-count="5">
        <circle cx="150" cy="150" r="120" fill="none" stroke="{{a.c}}" stroke-width="{{a.w}}" stroke-dasharray="{{a.dash}}" stroke-dashoffset="{{a.off}}" transform="rotate(135 150 150)"></circle>
      </sc-for>
      <circle cx="59.3" cy="71.4" r="11" fill="#111214"></circle>
      <circle cx="59.3" cy="71.4" r="7" fill="#ECECEE"></circle>
    </svg>
    <div style="position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center">
      <div style="font-size: 13px; color: #6FA8C7; font-weight: 600">In zone 2</div>
      <div style="font-size: 92px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums">138</div>
      <div style="font-size: 14px; color: #9C9DA5">bpm, target 128-145</div>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 246px; display: flex; justify-content: space-between; padding: 0 44px; font-size: 11px; color: #7C7D85">
      <div>Z1</div><div>Z5</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #1A1B1F; border-radius: 14px; padding: 12px 14px">
      <div style="font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums">14:32</div>
      <div style="font-size: 12px; color: #9C9DA5">Left in step</div>
    </div>
    <div style="background: #1A1B1F; border-radius: 14px; padding: 12px 14px">
      <div style="font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums">94%</div>
      <div style="font-size: 12px; color: #9C9DA5">Time in zone</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 4px">
    <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">15:28</div><div style="font-size: 12px; color: #9C9DA5">Elapsed</div></div>
    <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">1.42 mi</div><div style="font-size: 12px; color: #9C9DA5">Distance</div></div>
    <div><div style="font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums">10:55</div><div style="font-size: 12px; color: #9C9DA5">Pace /mi</div></div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 16px">
    <a href="M-Summary.dc.html" aria-label="End workout" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 4h-10a3 3 0 0 0 -3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3 -3v-10a3 3 0 0 0 -3 -3z"></path></svg>
    </a>
    <button aria-label="Pause" style="width: 80px; height: 80px; border-radius: 40px; border: none; background: #ECECEE; color: #111214; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path> <path d="M17 4h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h2a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2z"></path></svg>
    </button>
    <button aria-label="Skip step" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #1A1B1F; color: #ECECEE; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5v14a1 1 0 0 0 1.504 .864l12 -7a1 1 0 0 0 0 -1.728l-12 -7a1 1 0 0 0 -1.504 .864z"></path> <path d="M20 4a1 1 0 0 1 .993 .883l.007 .117v14a1 1 0 0 1 -1.993 .117l-.007 -.117v-14a1 1 0 0 1 1 -1z"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = 2 * Math.PI * 120;
    var seg = C * 54 / 360;
    var gap = 5;
    var arcs = [0, 1, 2, 3, 4].map(function (i) {
      var on = i === 1;
      return {
        c: on ? '#6FA8C7' : '#26272D',
        w: on ? 14 : 10,
        dash: (seg - gap).toFixed(1) + ' ' + (C - seg + gap).toFixed(1),
        off: (-seg * i).toFixed(1)
      };
    });
    return { arcs: arcs };
  }
}
</script>
</body>
</html>
